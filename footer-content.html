<!-- Cookie Banner -->
<div id="cookie-banner" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--border); padding: 1.25rem 8%; z-index: 9999; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); align-items: center; justify-content: space-between; gap: 1rem;">
    <p style="font-size: 0.88rem; color: var(--text-muted); margin: 0; max-width: 600px; line-height: 1.5;">
        We use cookies to analyze site traffic and improve your experience. See our <a href="/privacy.html" style="color: var(--sap-blue); font-weight: 500;">Privacy Policy</a>.
    </p>
    <div style="display: flex; gap: 0.75rem; flex-shrink: 0;">
        <button onclick="acceptCookies()" style="background: var(--sap-blue); color: #fff; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 600; font-size: 0.88rem; cursor: pointer; font-family: 'Inter', sans-serif;">Accept</button>
        <button onclick="declineCookies()" style="background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 9px 20px; border-radius: 6px; font-size: 0.88rem; cursor: pointer; font-family: 'Inter', sans-serif;">Decline</button>
    </div>
</div>

<script>
    const GA_ID = 'G-KBB3944TFW';

    function loadGA() {
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', GA_ID);
    }

    function acceptCookies() {
        localStorage.setItem('cookie-consent', 'accepted');
        document.getElementById('cookie-banner').style.display = 'none';
        loadGA();
    }

    function declineCookies() {
        localStorage.setItem('cookie-consent', 'declined');
        document.getElementById('cookie-banner').style.display = 'none';
    }

    window.onload = function() {
        const consent = localStorage.getItem('cookie-consent');
        if (!consent) {
            document.getElementById('cookie-banner').style.display = 'flex';
        } else if (consent === 'accepted') {
            loadGA();
        }
    };
</script>
